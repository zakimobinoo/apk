plugins {
    id 'com.android.application'
}

android {
    namespace 'com.boos.magneticscanner'
    compileSdk 35

    defaultConfig {
        applicationId "com.boos.magneticscanner"
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName "2.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
}

dependencies {
}
