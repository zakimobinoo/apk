plugins {
    id 'com.android.application'
}

android {
    namespace 'com.boos.magneticscanner'
    compileSdk 34

    defaultConfig {
        applicationId "com.boos.magneticscanner"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
}
